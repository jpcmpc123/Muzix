name: Muzix Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build & sign Muzix Android Release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Swap core submodule for the three-layers fix fork
        run: |
          rm -rf core
          git clone --depth 1 --branch fix/playback-three-layers https://github.com/jpcmpc123/core.git core
          if [ -s .github/patches/core-optimizations.patch ]; then
            git -C core apply ../.github/patches/core-optimizations.patch
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Write optional secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "SENTRY_DSN=${SENTRY_DSN}" > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}" >> ./local.properties
          echo "LASTFM_API_KEY=${LASTFM_API_KEY}" >> ./local.properties
          echo "LASTFM_SECRET=${LASTFM_SECRET}" >> ./local.properties
          echo "DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}" >> ./local.properties

      - name: Decode Muzix signing keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          printf '%s' "$BASE_64_SIGNING_KEY" | tr -d '\r\n ' | base64 -d > muzix.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Run unit tests (lyrics, scraper, domain, data, composeApp)
        run: |
          ./gradlew :lyricsService:jvmTest :kotlinYtmusicScraper:jvmTest :domain:jvmTest :composeApp:jvmTest --build-cache
          ./gradlew :data:jvmTest --tests "com.maxrave.data.mapping.*" --tests "com.maxrave.data.repository.*" --build-cache

      - name: Build and sign Muzix release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: muzix-release-apks
          path: androidApp/build/outputs/apk/release/Muzix-*.apk
