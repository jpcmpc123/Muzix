name: Build test APK (debug)

# Test-only workflow for this fork: builds a debug APK of the current branch so the
# fix can be installed and tried on a real device. Debug builds are signed with the
# standard Android debug key, so no signing secrets are needed. This file is NOT part
# of the fix and must never be included in an upstream pull request.
on:
  push:
    branches:
      - 'test/2711-apk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Write empty optional secrets
        run: |
          echo 'SENTRY_DSN=' > ./local.properties
          echo 'SENTRY_AUTH_TOKEN=' >> ./local.properties
          echo 'LASTFM_API_KEY=' >> ./local.properties
          echo 'LASTFM_SECRET=' >> ./local.properties
          echo 'DISCORD_CLIENT_ID=' >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-test-debug
          path: androidApp/build/outputs/apk/debug/*.apk
