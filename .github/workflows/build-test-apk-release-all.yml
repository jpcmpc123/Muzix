name: Build test APK (release, all fixes)

# Test-only workflow for this fork: builds a RELEASE (optimized) APK with all of
# jpcmpc123's fixes combined — #2714 (home tab), #2711 (search rotation), the bar
# blur gate (performance) — and the core submodule swapped for jpcmpc123/core
# branch fix/playback-three-layers (three-layer playback fix). Release builds from
# Gradle are unsigned (the upstream signing keys are repo secrets this fork does
# not have), so the APKs are signed here with a throwaway key generated in the
# runner, only so they can be installed on a real device for testing. This file is
# NOT part of any fix and must never be included in an upstream pull request.
on:
  push:
    branches:
      - 'test/all-fixes-release-apk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Swap core submodule for the three-layers fix fork
        run: |
          rm -rf core
          git clone --depth 1 --branch fix/playback-three-layers https://github.com/jpcmpc123/core.git core
          if [ -s .github/patches/core-optimizations.patch ]; then
            git -C core apply ../.github/patches/core-optimizations.patch
          fi

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Write empty optional secrets
        run: |
          echo 'SENTRY_DSN=' > ./local.properties
          echo 'SENTRY_AUTH_TOKEN=' >> ./local.properties
          echo 'LASTFM_API_KEY=' >> ./local.properties
          echo 'LASTFM_SECRET=' >> ./local.properties
          echo 'DISCORD_CLIENT_ID=' >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Run unit tests (lyrics, scraper, domain, data, composeApp)
        run: |
          ./gradlew :lyricsService:jvmTest :kotlinYtmusicScraper:jvmTest :domain:jvmTest :composeApp:jvmTest --build-cache
          ./gradlew :data:jvmTest --tests "com.maxrave.data.mapping.*" --tests "com.maxrave.data.repository.*" --build-cache

      - name: Build release APK (unsigned)
        run: ./gradlew androidApp:assembleRelease --build-cache -x lintVitalAnalyzeRelease

      - name: Sign APKs with test key
        run: |
          if [ -f .github/patches/testkey.jks ]; then
            cp .github/patches/testkey.jks /tmp/testkey.jks
          else
            keytool -genkeypair -v -keystore /tmp/testkey.jks -alias testkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SimpMusic Test, O=Test, C=BR"
          fi
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          ZIPALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | sort -V | tail -1)
          mkdir -p signed
          for apk in androidApp/build/outputs/apk/release/*-unsigned.apk; do
            name=$(basename "$apk" | sed 's/-unsigned//')
            "$ZIPALIGN" -f -p 4 "$apk" "/tmp/aligned.apk"
            "$APKSIGNER" sign --ks /tmp/testkey.jks --ks-pass pass:android --key-pass pass:android --out "signed/$name" /tmp/aligned.apk
          done
          ls -la signed/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-test-release
          path: signed/*arm64-v8a*.apk
